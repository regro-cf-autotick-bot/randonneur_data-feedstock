{% set name = "randonneur_data" %}
{% set version = "0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 33458191ad3f7ae6f1b45e68ff4b962288afc978273ab4a9894779dc0077398b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-build-isolation --no-deps . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=68.0
  run:
    - python >={{ python_min }}

test:
  imports:
    - randonneur_data
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/brightway-lca/randonneur_data
  summary: 'Data for the randonneur ETL library and spec'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/brightway-lca/randonneur_data

extra:
  recipe-maintainers:
    - m-rossi
